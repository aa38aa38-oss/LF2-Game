<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="政壇大亂鬥">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png">
  <title>政壇大亂鬥</title>
  <meta name="description" content="搞笑二創同人網頁格鬥遊戲：台灣政壇人物 2.5D 大亂鬥。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="loading">載入中…</div>

    <!-- 手機觸控操作（只在對戰中顯示） -->
    <div id="touch">
      <div id="stickZone"></div>
      <div id="stickBase"><div id="stickKnob"></div></div>
      <div class="acts">
        <div class="tbtn sup" data-btn="super">大招</div>
        <div class="tbtn spn" data-btn="spin">旋踢</div>
        <div class="tbtn jmp" data-btn="jump">跳</div>
        <div class="tbtn atk" data-btn="attack">攻</div>
      </div>
      <div class="tbtn sys pause" data-btn="pause">II</div>
    </div>

    <button id="mus" title="音樂開關（M）" tabindex="-1">♪ 音樂開</button>
    <button id="fs" title="全螢幕">⛶</button>

    <div id="nameBox">
      <input id="nameInput" maxlength="10" placeholder="你的名字" autocomplete="off">
      <button id="nameOk">送出</button>
    </div>

    <div id="rotate">
      <div class="phone">📱</div>
      <div>請把手機轉成<b>橫向</b>來玩</div>
      <small>建議先「加入主畫面」再開，可以全螢幕、不會被網址列擋住</small>
    </div>

    <div id="tip">
      <div class="card">
        <h3>📲 全螢幕玩法</h3>
        <p id="tipText"></p>
        <button id="tipOk">知道了</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
